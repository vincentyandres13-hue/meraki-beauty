<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meraki Beauty Center - SaaS Enterprise Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @media print {
      body { background-color: #FFF !important; }
      header, nav, .no-print { display: none !important; }
      .print-only { display: block !important; }
      main { margin: 0 !important; padding: 0 !important; max-width: 100% !important; }
      .card-report { border: 1px solid #CCC !important; box-shadow: none !important; }
    }
  </style>
</head>
<body style="margin: 0; background-color: #F9F8F6;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function MerakiBeautySaaS() {
      const [usuarioAutenticado, setUsuarioAutenticado] = useState(null);
      const [rolSeleccionadoLogin, setRolSeleccionadoLogin] = useState('estilista');
      const [estilistaLogin, setEstilistaLogin] = useState('Sarela');
      const [pinLogin, setPinLogin] = useState('');
      const [errorLogin, setErrorLogin] = useState('');

      const [personal, setPersonal] = useState([
        { id: 1, nombre: 'Sarela', cargo: 'Estilista', comision: 0.50, pin: '1111' },
        { id: 2, nombre: 'Karen', cargo: 'Estilista', comision: 0.50, pin: '2222' },
        { id: 3, nombre: 'Viki', cargo: 'Estilista', comision: 0.50, pin: '3333' },
        { id: 4, nombre: 'Ale', cargo: 'Estilista', comision: 0.50, pin: '4444' },
        { id: 5, nombre: 'Nilda', cargo: 'Estilista', comision: 0.50, pin: '5555' },
        { id: 6, nombre: 'Andrea Roque', cargo: 'Estilista', comision: 0.50, pin: '6666' },
        { id: 7, nombre: 'Laura', cargo: 'Estilista', comision: 0.50, pin: '7777' },
        { id: 8, nombre: 'Manuel Aguilar', cargo: 'Administración', comision: 0.00, pin: '2026' },
      ]);

      const [servicios, setServicios] = useState([
        { id: 1, nombre: 'Maquillaje y Peinado', precio: 150.00 },
        { id: 2, nombre: 'Bomba Capilar', precio: 120.00 },
        { id: 3, nombre: 'Cortes', precio: 60.00 },
        { id: 4, nombre: 'Laminado', precio: 180.00 },
        { id: 5, nombre: 'Pestañas', precio: 200.00 },
      ]);

      const [citas, setCitas] = useState([
        { id: 1, fecha: '2026-11-10', hora: '09:00', cliente: 'Milenka Ana Vega Garcia', celular: '72345678', servicio: 'Bomba Capilar', personal: 'Por Asignar', precio: 120, adelanto: 50, metodoAdelanto: 'QR (Casa)', saldo: 70, estado: '⏳ PENDIENTE ASIGNACIÓN', asistencia: 'Sin Novedad', modificadoAsistencia: false },
        { id: 2, fecha: '2026-11-10', hora: '10:30', cliente: 'Martina Rosas Vicente', celular: '71122334', servicio: 'Laminado', personal: 'Karen', precio: 180, adelanto: 180, metodoAdelanto: 'Efectivo', saldo: 0, estado: '🟢 APROBADO', asistencia: 'Asistió', modificadoAsistencia: false },
      ]);

      const [gastos, setGastos] = useState([
        { id: 1, fecha: '2026-11-10', descripcion: 'Insumos de limpieza y toallas', categoria: 'Limpieza', monto: 85.00, autorizado: 'Manuel Aguilar', turno: 'Mañana', estado: '🟢 APROBADO' }
      ]);

      const [arqueos, setArqueos] = useState([
        { id: 1, fecha: '2026-11-10', turno: 'Mañana', efectivoDeclarado: 350, qrRegistrado: 50, totalIngresosSist: 400, totalGastos: 85, diferencia: 0, estado: '🟢 APROBADO', responsable: 'Manuel Aguilar' }
      ]);

      const [limpiezaDescansos, setLimpiezaDescansos] = useState([
        { id: 1, fecha: '2026-11-10', persona: 'Sarela', turno: 'Mañana', tarea: 'Limpieza general de espejos y tocadores' },
        { id: 2, fecha: '2026-11-11', persona: 'Karen', turno: 'Tarde', tarea: 'Desinfección de lavabos y recepción' },
      ]);

      const [descuentos, setDescuentos] = useState([
        { id: 1, fecha: '2026-11-10', personal: 'Karen', monto: 20, motivo: 'Material dañado por descuido', estado: '🟢 APROBADO' }
      ]);

      const [autorizaciones, setAutorizaciones] = useState([
        { id: 1, solicitante: 'Sarela', tipo: 'Modificar asistencia por segunda vez', detalle: 'Clienta llegó tarde pero avisó', estado: 'PENDIENTE' }
      ]);

      const [recomendaciones, setRecomendaciones] = useState([
        { id: 1, estilista: 'Sarela', mensaje: '¡Excelente trabajo con las bombas capilares esta semana, Sarela! Sigue así.', fecha: '2026-11-10' }
      ]);

      const [activoTab, setActivoTab] = useState('agendaMatriz');
      const [tipoReporte, setTipoReporte] = useState('financiero');
      const [filtroFechaInicio, setFiltroFechaInicio] = useState('2026-11-01');
      const [filtroFechaFin, setFiltroFechaFin] = useState('2026-11-30');

      // Formulario Nueva Cita
      const [nuevaFecha, setNuevaFecha] = useState('2026-11-10');
      const [nuevaHora, setNuevaHora] = useState('11:00');
      const [nuevoCliente, setNuevoCliente] = useState('');
      const [nuevoCelular, setNuevoCelular] = useState('');
      const [nuevoServicio, setNuevoServicio] = useState('Cortes');
      const [nuevaEstilista, setNuevaEstilista] = useState('Por Asignar');
      const [nuevoAdelanto, setNuevoAdelanto] = useState('');
      const [nuevoMetodoAdelanto, setNuevoMetodoAdelanto] = useState('Efectivo');

      // Formulario Arqueo
      const [arqueoTurno, setArqueoTurno] = useState('Mañana');
      const [efectivoFisicoDeclarado, setEfectivoFisicoDeclarado] = useState('');
      const [qrFisicoDeclarado, setQrFisicoDeclarado] = useState('');

      // Formulario Gasto
      const [nuevoGastoDesc, setNuevoGastoDesc] = useState('');
      const [nuevoGastoMonto, setNuevoGastoMonto] = useState('');
      const [nuevoGastoCat, setNuevoGastoCat] = useState('Insumos');
      const [nuevoGastoTurno, setNuevoGastoTurno] = useState('Mañana');

      // Formulario Limpieza
      const [limpiezaFecha, setLimpiezaFecha] = useState('2026-11-10');
      const [limpiezaPersona, setLimpiezaPersona] = useState('Sarela');
      const [limpiezaTurno, setLimpiezaTurno] = useState('Mañana');
      const [limpiezaTarea, setLimpiezaTarea] = useState('');

      // Formulario Recomendaciones
      const [recEstilista, setRecEstilista] = useState('Sarela');
      const [recMensaje, setRecMensaje] = useState('');

      const manejarLogin = (e) => {
        e.preventDefault();
        setErrorLogin('');

        if (rolSeleccionadoLogin === 'gerencia') {
          const adminObj = personal.find(p => p.cargo === 'Administración' && p.pin === pinLogin);
          if (pinLogin === '2026' || adminObj) {
            setUsuarioAutenticado({ rol: 'gerencia', nombre: adminObj ? adminObj.nombre : 'Gerente / Dueño' });
            setActivoTab('reportes');
          } else {
            setErrorLogin('Credenciales incorrectas. Verifique su PIN.');
          }
        } else if (rolSeleccionadoLogin === 'administracion') {
          if (pinLogin === '1234' || pinLogin === '2026') {
            setUsuarioAutenticado({ rol: 'administracion', nombre: 'Administración' });
            setActivoTab('agendaMatriz');
          } else {
            setErrorLogin('Credenciales incorrectas. Verifique su PIN.');
          }
        } else if (rolSeleccionadoLogin === 'estilista') {
          const estilistaObj = personal.find(p => p.nombre === estilistaLogin);
          if (estilistaObj && (pinLogin === estilistaObj.pin || pinLogin === '2026')) {
            setUsuarioAutenticado({ rol: 'estilista', nombre: estilistaLogin });
            setActivoTab('agendaMatriz');
          } else {
            setErrorLogin('PIN incorrecto para la estilista seleccionada.');
          }
        }
        setPinLogin('');
      };

      const cerrarSesion = () => {
        setUsuarioAutenticado(null);
        setPinLogin('');
        setErrorLogin('');
      };

      const agregarCita = (e) => {
        e.preventDefault();
        if (!nuevoCliente.trim()) return alert('Ingrese clienta.');
        const servicioObj = servicios.find(s => s.nombre === nuevoServicio);
        const precioTotal = servicioObj ? servicioObj.precio : 100;
        const adelantoNum = parseFloat(nuevoAdelanto) || 0;

        setCitas([{
          id: Date.now(),
          fecha: nuevaFecha,
          hora: nuevaHora,
          cliente: nuevoCliente,
          celular: nuevoCelular || 'S/N',
          servicio: nuevoServicio,
          personal: nuevaEstilista,
          precio: precioTotal,
          adelanto: adelantoNum,
          metodoAdelanto: nuevoMetodoAdelanto,
          saldo: (precioTotal - adelantoNum) > 0 ? (precioTotal - adelantoNum) : 0,
          estado: (usuarioAutenticado.rol === 'gerencia' || usuarioAutenticado.rol === 'administracion') ? '🟢 APROBADO' : '🟡 PENDIENTE DE APROBACIÓN',
          asistencia: 'Sin Novedad',
          modificadoAsistencia: false
        }, ...citas]);

        setNuevoCliente('');
        setNuevoCelular('');
        setNuevoAdelanto('');
        alert('¡Cita registrada con éxito!');
        setActivoTab('agendaMatriz');
      };

      const solicitarCambioAsistencia = (id, nuevaAsistencia) => {
        if (usuarioAutenticado.rol === 'gerencia' || usuarioAutenticado.rol === 'administracion') {
          setCitas(citas.map(c => c.id === id ? { ...c, asistencia: nuevaAsistencia } : c));
        } else {
          const citaObj = citas.find(c => c.id === id);
          if (citaObj.modificadoAsistencia) {
            alert('⚠️ Ya realizaste la modificación de asistencia para esta cita. Enviando solicitud de autorización...');
            setAutorizaciones([...autorizaciones, {
              id: Date.now(),
              solicitante: usuarioAutenticado.nombre,
              tipo: 'Modificar asistencia por segunda vez',
              detalle: `Cita de ${citaObj.cliente} (${citaObj.fecha} ${citaObj.hora})`,
              estado: 'PENDIENTE'
            }]);
            setActivoTab('misAutorizaciones');
            return;
          }
          setCitas(citas.map(c => c.id === id ? { ...c, asistencia: nuevaAsistencia, modificadoAsistencia: true } : c));
          alert('Asistencia modificada.');
        }
      };

      const asignarEstilista = (id, nombreEstilista) => {
        if (usuarioAutenticado.rol === 'gerencia' || usuarioAutenticado.rol === 'administracion' || usuarioAutenticado.rol === 'estilista') {
          setCitas(citas.map(c => c.id === id ? { ...c, personal: nombreEstilista, estado: '🟢 APROBADO' } : c));
        } else {
          alert('No autorizado.');
        }
      };

      const registrarArqueo = (e) => {
        e.preventDefault();
        const efec = parseFloat(efectivoFisicoDeclarado) || 0;
        const qr = parseFloat(qrFisicoDeclarado) || 0;

        const ingresosSist = citas.reduce((acc, c) => acc + c.adelanto, 0); 
        const gastosSist = gastos.reduce((acc, g) => acc + g.monto, 0);

        setArqueos([{
          id: Date.now(),
          fecha: new Date().toISOString().split('T')[0],
          turno: arqueoTurno,
          efectivoDeclarado: efec,
          qrRegistrado: qr,
          totalIngresosSist: ingresosSist,
          totalGastos: gastosSist,
          diferencia: (efec + qr) - (ingresosSist - gastosSist),
          estado: usuarioAutenticado.rol === 'gerencia' ? '🟢 APROBADO' : '🟡 PENDIENTE DE APROBACIÓN',
          responsable: usuarioAutenticado.nombre
        }, ...arqueos]);

        setEfectivoFisicoDeclarado('');
        setQrFisicoDeclarado('');
        alert('¡Arqueo declarado y enviado a gerencia/administración!');
      };

      const aprobarArqueo = (id) => {
        setArqueos(arqueos.map(a => a.id === id ? { ...a, estado: '🟢 APROBADO' } : a));
      };

      const guardarGasto = (e) => {
        e.preventDefault();
        if (!nuevoGastoDesc || !nuevoGastoMonto) return alert('Complete los datos.');
        setGastos([...gastos, {
          id: Date.now(),
          fecha: new Date().toISOString().split('T')[0],
          descripcion: nuevoGastoDesc,
          categoria: nuevoGastoCat,
          monto: parseFloat(nuevoGastoMonto),
          autorizado: usuarioAutenticado.nombre,
          turno: nuevoGastoTurno,
          estado: (usuarioAutenticado.rol === 'gerencia' || usuarioAutenticado.rol === 'administracion') ? '🟢 APROBADO' : '🟡 PENDIENTE DE APROBACIÓN'
        }]);
        setNuevoGastoDesc('');
        setNuevoGastoMonto('');
        alert('Gasto registrado (pendiente de aprobación gerencial si fue registrado por staff).');
      };

      const aprobarGasto = (id) => {
        setGastos(gastos.map(g => g.id === id ? { ...g, estado: '🟢 APROBADO' } : g));
      };

      const guardarLimpieza = (e) => {
        e.preventDefault();
        if (!limpiezaTarea.trim()) return alert('Ingrese la tarea.');
        setLimpiezaDescansos([...limpiezaDescansos, {
          id: Date.now(),
          fecha: limpiezaFecha,
          persona: limpiezaPersona,
          turno: limpiezaTurno,
          tarea: limpiezaTarea
        }]);
        setLimpiezaTarea('');
        alert('¡Asignación guardada!');
      };

      const guardarRecomendacion = (e) => {
        e.preventDefault();
        if (!recMensaje.trim()) return alert('Escriba un mensaje.');
        setRecomendaciones([...recomendaciones, {
          id: Date.now(),
          estilista: recEstilista,
          mensaje: recMensaje,
          fecha: new Date().toISOString().split('T')[0]
        }]);
        setRecMensaje('');
        alert('¡Recomendación enviada con éxito a la estilista!');
      };

      const aprobarAutorizacion = (id) => {
        setAutorizaciones(autorizaciones.map(a => a.id === id ? { ...a, estado: '🟢 APROBADO' } : a));
      };

      const citasFiltradas = citas.filter(c => c.fecha >= filtroFechaInicio && c.fecha <= filtroFechaFin);
      const gastosFiltrados = gastos.filter(g => g.fecha >= filtroFechaInicio && g.fecha <= filtroFechaFin);
      const totalIngresos = citasFiltradas.reduce((acc, c) => acc + c.precio, 0);
      const totalGastos = gastosFiltrados.filter(g => g.estado === '🟢 APROBADO').reduce((acc, g) => acc + g.monto, 0);
      const totalComisiones = personal.reduce((acc, p) => {
        const ventasPersonal = citasFiltradas.filter(c => c.personal === p.nombre).reduce((sum, c) => sum + c.precio, 0);
        return acc + (ventasPersonal * p.comision);
      }, 0);
      const utilidadNeta = totalIngresos - totalComisiones - totalGastos;

      const horasMatriz = ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'];
      const diasMatriz = ['2026-11-10', '2026-11-11', '2026-11-12', '2026-11-13', '2026-11-14', '2026-11-15', '2026-11-16'];

      if (!usuarioAutenticado) {
        return (
          <div style={{ minHeight: '100vh', display: 'flex', justifyContent: 'center', alignItems: 'center', backgroundColor: '#1A1A1A', padding: '16px', fontFamily: 'Work Sans, sans-serif' }}>
            <div style={{ backgroundColor: '#FFFFFF', padding: '32px', borderRadius: '12px', width: '100%', maxWidth: '400px', boxShadow: '0 10px 25px rgba(0,0,0,0.3)', borderTop: '6px solid #E8C5C8' }}>
              <div style={{ textAlign: 'center', marginBottom: '24px' }}>
                <h1 style={{ margin: 0, fontSize: '22px', fontWeight: '700', color: '#1A1A1A' }}>MERAKI BEAUTY CENTER</h1>
                <p style={{ margin: '6px 0 0 0', fontSize: '13px', color: '#888' }}>Sistema SaaS Ejecutivo (Oruro, Bolivia)</p>
              </div>

              {errorLogin && (
                <div style={{ backgroundColor: '#FEE2E2', color: '#991B1B', padding: '10px', borderRadius: '6px', fontSize: '13px', marginBottom: '16px', textAlign: 'center', fontWeight: '500' }}>
                  {errorLogin}
                </div>
              )}

              <form onSubmit={manejarLogin} style={{ display: 'grid', gap: '16px' }}>
                <div>
                  <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '6px', color: '#333' }}>Seleccione su Rol:</label>
                  <select value={rolSeleccionadoLogin} onChange={(e) => setRolSeleccionadoLogin(e.target.value)} style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #E2DDD5', fontSize: '14px', fontWeight: '500' }}>
                    <option value="estilista">✂️ Personal Estilista</option>
                    <option value="administracion">📋 Administración</option>
                    <option value="gerencia">👑 Gerencia / Dueños</option>
                  </select>
                </div>

                {rolSeleccionadoLogin === 'estilista' && (
                  <div>
                    <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '6px', color: '#333' }}>Seleccione su Nombre:</label>
                    <select value={estilistaLogin} onChange={(e) => setEstilistaLogin(e.target.value)} style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #E2DDD5', fontSize: '14px' }}>
                      {personal.filter(p => p.cargo === 'Estilista').map(p => (
                        <option key={p.id} value={p.nombre}>{p.nombre}</option>
                      ))}
                    </select>
                  </div>
                )}

                <div>
                  <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '6px', color: '#333' }}>PIN de Acceso Personal:</label>
                  <input type="password" maxLength="4" placeholder="••••" value={pinLogin} onChange={(e) => setPinLogin(e.target.value)} style={{ width: '100%', padding: '12px', borderRadius: '6px', border: '1px solid #E2DDD5', fontSize: '18px', textAlign: 'center', letterSpacing: '4px', boxSizing: 'border-box' }} required />
                </div>

                <button type="submit" style={{ backgroundColor: '#1A1A1A', color: '#FFFFFF', border: 'none', padding: '12px', borderRadius: '6px', fontWeight: '700', fontSize: '15px', cursor: 'pointer', marginTop: '8px' }}>
                  Ingresar al Sistema
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div style={{ fontFamily: 'Work Sans, sans-serif', backgroundColor: '#F9F8F6', color: '#1A1A1A', minHeight: '100vh', paddingBottom: '40px' }}>
          
          <header className="no-print" style={{ backgroundColor: '#1A1A1A', color: '#FFFFFF', padding: '14px 24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '3px solid #E8C5C8', flexWrap: 'wrap', gap: '12px' }}>
            <div>
              <h1 style={{ margin: 0, fontSize: '18px', fontWeight: '700' }}>MERAKI BEAUTY CENTER</h1>
              <span style={{ fontSize: '12px', color: '#E8C5C8' }}>Usuario Activo: <strong>{usuarioAutenticado.nombre}</strong> ({usuarioAutenticado.rol.toUpperCase()})</span>
            </div>

            <button onClick={cerrarSesion} style={{ backgroundColor: '#333', color: '#E8C5C8', border: '1px solid #E8C5C8', padding: '6px 14px', borderRadius: '6px', cursor: 'pointer', fontSize: '12px', fontWeight: '600' }}>
              🔒 Cerrar Sesión
            </button>
          </header>

          <nav className="no-print" style={{ backgroundColor: '#2D2D2D', padding: '0 24px', display: 'flex', gap: '8px', overflowX: 'auto' }}>
            {usuarioAutenticado.rol === 'gerencia' && (
              <button onClick={() => setActivoTab('reportes')} style={tabStyle(activoTab === 'reportes')}>📊 Reportes</button>
            )}
            <button onClick={() => setActivoTab('agendaMatriz')} style={tabStyle(activoTab === 'agendaMatriz')}>📅 Calendario Matriz</button>
            <button onClick={() => setActivoTab('nuevaCita')} style={tabStyle(activoTab === 'nuevaCita')}>➕ Agendar Cita</button>
            <button onClick={() => setActivoTab('arqueo')} style={tabStyle(activoTab === 'arqueo')}>💰 Arqueos</button>
            <button onClick={() => setActivoTab('gastos')} style={tabStyle(activoTab === 'gastos')}>🧾 Gastos</button>
            <button onClick={() => setActivoTab('limpieza')} style={tabStyle(activoTab === 'limpieza')}>🧹 Limpieza & Descansos</button>
            <button onClick={() => setActivoTab('comisiones')} style={tabStyle(activoTab === 'comisiones')}>💵 Comisiones Netas</button>
            <button onClick={() => setActivoTab('recomendaciones')} style={tabStyle(activoTab === 'recomendaciones')}>⭐ Recomendaciones</button>
            <button onClick={() => setActivoTab('misAutorizaciones')} style={tabStyle(activoTab === 'misAutorizaciones')}>🔐 Solicitudes</button>
            {usuarioAutenticado.rol === 'gerencia' && (
              <button onClick={() => setActivoTab('config')} style={tabStyle(activoTab === 'config')}>⚙️ Personal & PINs</button>
            )}
          </nav>

          <main style={{ maxWidth: '1300px', margin: '24px auto', padding: '0 16px' }}>

            {/* REPORTE GERENCIAL */}
            {activoTab === 'reportes' && usuarioAutenticado.rol === 'gerencia' && (
              <div>
                <div className="no-print" style={{ backgroundColor: '#FFFFFF', padding: '20px', borderRadius: '8px', border: '1px solid #E2DDD5', marginBottom: '24px' }}>
                  <h3 style={{ margin: '0 0 16px 0', borderLeft: '4px solid #E8C5C8', paddingLeft: '8px' }}>Filtros de Reporte Gerencial</h3>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '16px', alignItems: 'end' }}>
                    <div>
                      <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '6px' }}>Tipo de Reporte:</label>
                      <select value={tipoReporte} onChange={(e) => setTipoReporte(e.target.value)} style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #E2DDD5', fontWeight: '600' }}>
                        <option value="financiero">📈 Resumen Financiero Ejecutivo</option>
                        <option value="estilistas">✂️ Rendimiento y Comisiones (Montos Netos)</option>
                        <option value="gastos">🧾 Desglose Consolidado de Gastos</option>
                        <option value="arqueos">💰 Auditoría de Arqueos de Turno</option>
                      </select>
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '6px' }}>Fecha Inicio:</label>
                      <input type="date" value={filtroFechaInicio} onChange={(e) => setFiltroFechaInicio(e.target.value)} style={{ width: '100%', padding: '9px', borderRadius: '6px', border: '1px solid #E2DDD5' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '6px' }}>Fecha Fin:</label>
                      <input type="date" value={filtroFechaFin} onChange={(e) => setFiltroFechaFin(e.target.value)} style={{ width: '100%', padding: '9px', borderRadius: '6px', border: '1px solid #E2DDD5' }} />
                    </div>
                    <button onClick={() => window.print()} style={{ backgroundColor: '#1A1A1A', color: '#FFFFFF', border: 'none', padding: '11px', borderRadius: '6px', fontWeight: '700', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}>
                      🖨️ Imprimir / Guardar PDF
                    </button>
                  </div>
                </div>

                <div className="card-report" style={{ backgroundColor: '#FFFFFF', padding: '32px', borderRadius: '8px', border: '1px solid #E2DDD5' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '2px solid #1A1A1A', paddingBottom: '16px', marginBottom: '24px' }}>
                    <div>
                      <h1 style={{ margin: 0, fontSize: '24px', fontWeight: '700' }}>MERAKI BEAUTY CENTER</h1>
                      <p style={{ margin: '4px 0 0 0', fontSize: '14px', color: '#666' }}>Oruro, Bolivia • Informe Oficial Gerencial</p>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <span style={{ fontSize: '12px', color: '#888', display: 'block' }}>Rango de Evaluación:</span>
                      <strong style={{ fontSize: '14px' }}>{filtroFechaInicio} al {filtroFechaFin}</strong>
                    </div>
                  </div>

                  {tipoReporte === 'financiero' && (
                    <div>
                      <h2 style={{ fontSize: '18px', marginBottom: '16px' }}>1. Resumen Consolidado de Resultados</h2>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px', marginBottom: '24px' }}>
                        <TarjetaKPI titulo="Total Ingresos Brutos" valor={`Bs ${totalIngresos.toFixed(2)}`} color="#1A1A1A" />
                        <TarjetaKPI titulo="Comisiones Totales Personal" valor={`Bs ${totalComisiones.toFixed(2)}`} color="#D97706" />
                        <TarjetaKPI titulo="Gastos Operativos Aprobados" valor={`Bs ${totalGastos.toFixed(2)}`} color="#DC2626" />
                        <TarjetaKPI titulo="Utilidad Neta Estimada" valor={`Bs ${utilidadNeta.toFixed(2)}`} color="#059669" />
                      </div>
                    </div>
                  )}

                  {tipoReporte === 'estilistas' && (
                    <div>
                      <h2 style={{ fontSize: '18px', marginBottom: '16px' }}>2. Liquidación de Comisiones (Monto Neto)</h2>
                      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '14px' }}>
                        <thead>
                          <tr style={{ backgroundColor: '#F5EBEE', borderBottom: '2px solid #E2DDD5' }}>
                            <th style={thStyle}>Personal</th>
                            <th style={thStyle}>Servicios Realizados</th>
                            <th style={thStyle}>Total Ventas (Bs)</th>
                            <th style={thStyle}>Comisión Neta (Bs)</th>
                          </tr>
                        </thead>
                        <tbody>
                          {personal.filter(p => p.cargo === 'Estilista').map(p => {
                            const citasPersonal = citasFiltradas.filter(c => c.personal === p.nombre);
                            const totalVentas = citasPersonal.reduce((sum, c) => sum + c.precio, 0);
                            const ganancia = totalVentas * p.comision;
                            return (
                              <tr key={p.id} style={{ borderBottom: '1px solid #E2DDD5' }}>
                                <td style={tdStyle}><strong>{p.nombre}</strong></td>
                                <td style={tdStyle}>{citasPersonal.length} servicios</td>
                                <td style={tdStyle}>Bs {totalVentas.toFixed(2)}</td>
                                <td style={tdStyle}><strong style={{ color: '#059669', fontSize: '16px' }}>Bs {ganancia.toFixed(2)}</strong></td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}

                  {tipoReporte === 'arqueos' && (
                    <div>
                      <h2 style={{ fontSize: '18px', marginBottom: '16px' }}>3. Auditoría de Arqueos por Turno</h2>
                      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
                        <thead>
                          <tr style={{ backgroundColor: '#F5EBEE', borderBottom: '2px solid #E2DDD5' }}>
                            <th style={thStyle}>Fecha / Turno</th>
                            <th style={thStyle}>Responsable</th>
                            <th style={thStyle}>Efectivo Declarado</th>
                            <th style={thStyle}>QR</th>
                            <th style={thStyle}>Diferencia</th>
                            <th style={thStyle}>Estado</th>
                          </tr>
                        </thead>
                        <tbody>
                          {arqueos.map(a => (
                            <tr key={a.id} style={{ borderBottom: '1px solid #E2DDD5' }}>
                              <td style={tdStyle}>{a.fecha} [{a.turno}]</td>
                              <td style={tdStyle}>{a.responsable}</td>
                              <td style={tdStyle}>Bs {a.efectivoDeclarado}</td>
                              <td style={tdStyle}>Bs {a.qrRegistrado}</td>
                              <td style={tdStyle}><strong style={{ color: a.diferencia === 0 ? '#059669' : '#DC2626' }}>Bs {a.diferencia}</strong></td>
                              <td style={tdStyle}>{a.estado}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}

                  {tipoReporte === 'gastos' && (
                    <div>
                      <h2 style={{ fontSize: '18px', marginBottom: '16px' }}>4. Desglose de Gastos Operativos</h2>
                      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '14px' }}>
                        <thead>
                          <tr style={{ backgroundColor: '#F5EBEE', borderBottom: '2px solid #E2DDD5' }}>
                            <th style={thStyle}>Fecha/Turno</th>
                            <th style={thStyle}>Descripción</th>
                            <th style={thStyle}>Categoría</th>
                            <th style={thStyle}>Autorizado Por</th>
                            <th style={thStyle}>Monto (Bs)</th>
                          </tr>
                        </thead>
                        <tbody>
                          {gastosFiltrados.map(g => (
                            <tr key={g.id} style={{ borderBottom: '1px solid #E2DDD5' }}>
                              <td style={tdStyle}>{g.fecha} ({g.turno})</td>
                              <td style={tdStyle}>{g.descripcion}</td>
                              <td style={tdStyle}>{g.categoria}</td>
                              <td style={tdStyle}>{g.autorizado}</td>
                              <td style={tdStyle}><strong style={{ color: '#DC2626' }}>Bs {g.monto.toFixed(2)}</strong></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* CALENDARIO MATRIZ */}
            {activoTab === 'agendaMatriz' && (
              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                  <h2 style={{ borderLeft: '4px solid #E8C5C8', paddingLeft: '8px', margin: 0 }}>Calendario Matriz Semanal</h2>
                  <button onClick={() => setActivoTab('nuevaCita')} style={btnPrimaryStyle}>+ Agendar Cita</button>
                </div>

                <div style={{ backgroundColor: '#FFFFFF', borderRadius: '8px', border: '1px solid #E2DDD5', overflowX: 'auto', padding: '16px' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '12px', minWidth: '900px' }}>
                    <thead>
                      <tr style={{ backgroundColor: '#1A1A1A', color: '#FFF' }}>
                        <th style={{ padding: '10px', border: '1px solid #444' }}>Hora</th>
                        {diasMatriz.map(dia => (
                          <th key={dia} style={{ padding: '10px', border: '1px solid #444' }}>{dia}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {horasMatriz.map(hora => (
                        <tr key={hora}>
                          <td style={{ padding: '10px', border: '1px solid #E2DDD5', fontWeight: '750', backgroundColor: '#F5EBEE', textAlign: 'center' }}>{hora}</td>
                          {diasMatriz.map(dia => {
                            const citasEnEsaHora = citas.filter(c => c.fecha === dia && c.hora.startsWith(hora.substring(0, 2)));
                            return (
                              <td key={dia} style={{ padding: '8px', border: '1px solid #E2DDD5', verticalAlign: 'top', minHeight: '80px', backgroundColor: citasEnEsaHora.length > 0 ? '#FFFBEB' : '#FFF' }}>
                                {citasEnEsaHora.map(c => (
                                  <div key={c.id} style={{ backgroundColor: '#FFFFFF', border: '1px solid #D97706', borderRadius: '4px', padding: '6px', marginBottom: '6px', boxShadow: '0 1px 2px rgba(0,0,0,0.05)' }}>
                                    <div style={{ fontWeight: '700', color: '#1A1A1A', fontSize: '13px' }}>{c.cliente}</div>
                                    <div style={{ color: '#555' }}>💇‍♀️ {c.servicio}</div>
                                    
                                    <div style={{ marginTop: '4px', fontSize: '11px' }}>
                                      Estilista: 
                                      {(usuarioAutenticado.rol === 'gerencia' || usuarioAutenticado.rol === 'administracion') ? (
                                        <select value={c.personal} onChange={(e) => asignarEstilista(c.id, e.target.value)} style={{ fontSize: '11px', padding: '2px', marginLeft: '4px' }}>
                                          <option value="Por Asignar">Por Asignar</option>
                                          {personal.filter(p => p.cargo === 'Estilista').map(p => (
                                            <option key={p.id} value={p.nombre}>{p.nombre}</option>
                                          ))}
                                        </select>
                                      ) : (
                                        <strong style={{ color: '#03543F', marginLeft: '4px' }}>{c.personal}</strong>
                                      )}
                                    </div>

                                    <div style={{ marginTop: '4px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                      <select value={c.asistencia} onChange={(e) => solicitarCambioAsistencia(c.id, e.target.value)} style={{ fontSize: '10px', padding: '2px' }}>
                                        <option value="Sin Novedad">Sin Novedad</option>
                                        <option value="Asistió">🟢 Asistió</option>
                                        <option value="Llegó Tarde">🟡 Tarde</option>
                                        <option value="No Asistió">🔴 No Asistió</option>
                                      </select>
                                    </div>
                                  </div>
                                ))}
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* NUEVA CITA */}
            {activoTab === 'nuevaCita' && (
              <div style={{ maxWidth: '600px', margin: '0 auto', backgroundColor: '#FFFFFF', padding: '24px', borderRadius: '8px', border: '1px solid #E2DDD5' }}>
                <h2 style={{ borderLeft: '4px solid #E8C5C8', paddingLeft: '8px', marginTop: 0, marginBottom: '20px' }}>Registrar Nueva Cita</h2>
                <form onSubmit={agregarCita} style={{ display: 'grid', gap: '16px' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                    <div>
                      <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Fecha:</label>
                      <input type="date" value={nuevaFecha} onChange={(e) => setNuevaFecha(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Hora:</label>
                      <input type="time" value={nuevaHora} onChange={(e) => setNuevaHora(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }} />
                    </div>
                  </div>
                  <div>
                    <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Nombre Clienta:</label>
                    <input type="text" placeholder="Ej. Ana Gomez" value={nuevoCliente} onChange={(e) => setNuevoCliente(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }} required />
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                    <div>
                      <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Servicio:</label>
                      <select value={nuevoServicio} onChange={(e) => setNuevoServicio(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }}>
                        {servicios.map(s => (
                          <option key={s.id} value={s.nombre}>{s.nombre} (Bs {s.precio})</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Estilista:</label>
                      <select value={nuevaEstilista} onChange={(e) => setNuevaEstilista(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }}>
                        <option value="Por Asignar">-- Por Asignar --</option>
                        {personal.filter(p => p.cargo === 'Estilista').map(p => (
                          <option key={p.id} value={p.nombre}>{p.nombre}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                    <div>
                      <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Adelanto / Seña (Bs):</label>
                      <input type="number" placeholder="0" value={nuevoAdelanto} onChange={(e) => setNuevoAdelanto(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Método Adelanto:</label>
                      <select value={nuevoMetodoAdelanto} onChange={(e) => setNuevoMetodoAdelanto(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }}>
                        <option value="Efectivo Salón">Efectivo en Salón</option>
                        <option value="QR (Casa)">QR (Remoto / Casa)</option>
                      </select>
                    </div>
                  </div>
                  <button type="submit" style={{ ...btnPrimaryStyle, padding: '12px', marginTop: '10px' }}>Guardar Cita</button>
                </form>
              </div>
            )}

            {/* ARQUEO DE CAJA */}
            {activoTab === 'arqueo' && (
              <div>
                <h2 style={{ borderLeft: '4px solid #E8C5C8', paddingLeft: '8px', marginBottom: '20px' }}>Arqueo de Caja por Turnos</h2>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '24px' }}>
                  <div style={{ backgroundColor: '#FFFFFF', padding: '24px', borderRadius: '8px', border: '1px solid #E2DDD5' }}>
                    <h3 style={{ marginTop: 0 }}>Declarar Cierre de Turno</h3>
                    <form onSubmit={registrarArqueo} style={{ display: 'grid', gap: '14px' }}>
                      <div>
                        <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Turno:</label>
                        <select value={arqueoTurno} onChange={(e) => setArqueoTurno(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }}>
                          <option value="Mañana">Turno Mañana</option>
                          <option value="Tarde">Turno Tarde</option>
                        </select>
                      </div>
                      <div>
                        <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Efectivo Físico Contado (Bs):</label>
                        <input type="number" step="0.01" placeholder="Ej. 350" value={efectivoFisicoDeclarado} onChange={(e) => setEfectivoFisicoDeclarado(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }} required />
                      </div>
                      <div>
                        <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Total QR Registrados (Bs):</label>
                        <input type="number" step="0.01" placeholder="Ej. 100" value={qrFisicoDeclarado} onChange={(e) => setQrFisicoDeclarado(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }} required />
                      </div>
                      <button type="submit" style={btnPrimaryStyle}>Enviar Arqueo</button>
                    </form>
                  </div>

                  <div style={{ backgroundColor: '#FFFFFF', padding: '24px', borderRadius: '8px', border: '1px solid #E2DDD5' }}>
                    <h3 style={{ marginTop: 0 }}>
                      {usuarioAutenticado.rol === 'estilista' ? 'Mis Arqueos Realizados' : 'Historial de Arqueos'}
                    </h3>
                    <div style={{ overflowX: 'auto' }}>
                      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
                        <thead>
                          <tr style={{ backgroundColor: '#F5EBEE', borderBottom: '2px solid #E2DDD5' }}>
                            <th style={thStyle}>Turno</th>
                            <th style={thStyle}>Efectivo / QR</th>
                            <th style={thStyle}>Estado</th>
                            <th style={thStyle}>Acción</th>
                          </tr>
                        </thead>
                        <tbody>
                          {arqueos
                            .filter(a => usuarioAutenticado.rol !== 'estilista' || a.responsable === usuarioAutenticado.nombre)
                            .map(a => (
                              <tr key={a.id} style={{ borderBottom: '1px solid #E2DDD5' }}>
                                <td style={tdStyle}>{a.fecha} <br/><strong>{a.turno}</strong></td>
                                <td style={tdStyle}>Efec: Bs {a.efectivoDeclarado} <br/>QR: Bs {a.qrRegistrado}</td>
                                <td style={tdStyle}>{a.estado}</td>
                                <td style={tdStyle}>
                                  {usuarioAutenticado.rol === 'gerencia' && a.estado.includes('PENDIENTE') && (
                                    <button onClick={() => aprobarArqueo(a.id)} style={{ backgroundColor: '#059669', color: '#FFF', border: 'none', padding: '4px 8px', borderRadius: '4px', cursor: 'pointer', fontSize: '11px', fontWeight: '700' }}>Aprobar</button>
                                  )}
                                </td>
                              </tr>
                            ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* GASTOS (CON APROBACIÓN REQUERIDA Y VISIBILIDAD SEGMENTADA) */}
            {activoTab === 'gastos' && (
              <div>
                <h2 style={{ borderLeft: '4px solid #E8C5C8', paddingLeft: '8px', marginBottom: '20px' }}>Gastos Operativos</h2>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '24px' }}>
                  <div style={{ backgroundColor: '#FFFFFF', padding: '24px', borderRadius: '8px', border: '1px solid #E2DDD5' }}>
                    <h3 style={{ marginTop: 0 }}>Registrar Gasto</h3>
                    <form onSubmit={guardarGasto} style={{ display: 'grid', gap: '14px' }}>
                      <div>
                        <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Descripción:</label>
                        <input type="text" placeholder="Ej. Materiales, café" value={nuevoGastoDesc} onChange={(e) => setNuevoGastoDesc(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }} required />
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                        <div>
                          <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Monto (Bs):</label>
                          <input type="number" step="0.01" placeholder="0.00" value={nuevoGastoMonto} onChange={(e) => setNuevoGastoMonto(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }} required />
                        </div>
                        <div>
                          <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Turno:</label>
                          <select value={nuevoGastoTurno} onChange={(e) => setNuevoGastoTurno(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }}>
                            <option value="Mañana">Mañana</option>
                            <option value="Tarde">Tarde</option>
                          </select>
                        </div>
                      </div>
                      <button type="submit" style={btnPrimaryStyle}>Guardar Gasto</button>
                    </form>
                  </div>

                  <div style={{ backgroundColor: '#FFFFFF', padding: '24px', borderRadius: '8px', border: '1px solid #E2DDD5' }}>
                    <h3 style={{ marginTop: 0 }}>
                      {usuarioAutenticado.rol === 'estilista' ? 'Mis Gastos Registrados' : 'Historial y Aprobación de Gastos'}
                    </h3>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
                      <thead>
                        <tr style={{ backgroundColor: '#F5EBEE' }}>
                          <th style={thStyle}>Turno/Autorizado</th>
                          <th style={thStyle}>Descripción</th>
                          <th style={thStyle}>Monto</th>
                          <th style={thStyle}>Estado</th>
                        </tr>
                      </thead>
                      <tbody>
                        {gastos
                          .filter(g => usuarioAutenticado.rol !== 'estilista' || g.autorizado === usuarioAutenticado.nombre)
                          .map(g => (
                            <tr key={g.id} style={{ borderBottom: '1px solid #E2DDD5' }}>
                              <td style={tdStyle}>{g.fecha} ({g.turno})<br/><span style={{ fontSize: '11px', color: '#666' }}>{g.autorizado}</span></td>
                              <td style={tdStyle}>{g.descripcion}</td>
                              <td style={tdStyle}><strong style={{ color: '#DC2626' }}>Bs {g.monto.toFixed(2)}</strong></td>
                              <td style={tdStyle}>
                                {g.estado}
                                {usuarioAutenticado.rol === 'gerencia' && g.estado.includes('PENDIENTE') && (
                                  <button onClick={() => aprobarGasto(g.id)} style={{ backgroundColor: '#059669', color: '#FFF', border: 'none', padding: '3px 6px', borderRadius: '4px', cursor: 'pointer', fontSize: '10px', marginLeft: '6px', fontWeight: '700' }}>Aprobar</button>
                                )}
                              </td>
                            </tr>
                          ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* LIMPIEZA Y DESCANSOS (VISIBLE PARA TODAS) */}
            {activoTab === 'limpieza' && (
              <div>
                <h2 style={{ borderLeft: '4px solid #E8C5C8', paddingLeft: '8px', marginBottom: '20px' }}>Cronograma General de Limpieza y Descansos</h2>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '24px' }}>
                  {(usuarioAutenticado.rol === 'gerencia' || usuarioAutenticado.rol === 'administracion') && (
                    <div style={{ backgroundColor: '#FFFFFF', padding: '24px', borderRadius: '8px', border: '1px solid #E2DDD5' }}>
                      <h3 style={{ marginTop: 0 }}>Asignar Turno de Limpieza</h3>
                      <form onSubmit={guardarLimpieza} style={{ display: 'grid', gap: '14px' }}>
                        <div>
                          <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Fecha:</label>
                          <input type="date" value={limpiezaFecha} onChange={(e) => setLimpiezaFecha(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }} />
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                          <div>
                            <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Personal:</label>
                            <select value={limpiezaPersona} onChange={(e) => setLimpiezaPersona(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }}>
                              {personal.filter(p => p.cargo === 'Estilista').map(p => (
                                <option key={p.id} value={p.nombre}>{p.nombre}</option>
                              ))}
                            </select>
                          </div>
                          <div>
                            <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Turno:</label>
                            <select value={limpiezaTurno} onChange={(e) => setLimpiezaTurno(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }}>
                              <option value="Mañana">Mañana</option>
                              <option value="Tarde">Tarde</option>
                            </select>
                          </div>
                        </div>
                        <div>
                          <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Detalle / Tarea:</label>
                          <input type="text" placeholder="Ej. Limpieza de espejos" value={limpiezaTarea} onChange={(e) => setLimpiezaTarea(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }} required />
                        </div>
                        <button type="submit" style={btnPrimaryStyle}>Guardar Asignación</button>
                      </form>
                    </div>
                  )}

                  <div style={{ backgroundColor: '#FFFFFF', padding: '24px', borderRadius: '8px', border: '1px solid #E2DDD5' }}>
                    <h3 style={{ marginTop: 0 }}>Cronograma Activo (Visible para Todo el Personal)</h3>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
                      <thead>
                        <tr style={{ backgroundColor: '#F5EBEE', borderBottom: '2px solid #E2DDD5' }}>
                          <th style={thStyle}>Fecha / Turno</th>
                          <th style={thStyle}>Personal</th>
                          <th style={thStyle}>Tarea</th>
                        </tr>
                      </thead>
                      <tbody>
                        {limpiezaDescansos.map(item => (
                          <tr key={item.id} style={{ borderBottom: '1px solid #E2DDD5' }}>
                            <td style={tdStyle}>{item.fecha} <br/><strong>{item.turno}</strong></td>
                            <td style={tdStyle}><strong>{item.persona}</strong></td>
                            <td style={tdStyle}>{item.tarea}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* COMISIONES (SOLO MONTO NETO) */}
            {activoTab === 'comisiones' && (
              <div>
                <h2 style={{ borderLeft: '4px solid #E8C5C8', paddingLeft: '8px', marginBottom: '20px' }}>
                  {usuarioAutenticado.rol === 'estilista' ? `Mi Ganancia Neta (${usuarioAutenticado.nombre})` : 'Liquidación de Comisiones Netas'}
                </h2>
                <div style={{ backgroundColor: '#FFFFFF', borderRadius: '8px', border: '1px solid #E2DDD5', padding: '16px', overflowX: 'auto' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '14px' }}>
                    <thead>
                      <tr style={{ backgroundColor: '#F5EBEE', borderBottom: '2px solid #E2DDD5' }}>
                        <th style={thStyle}>Estilista</th>
                        <th style={thStyle}>Servicios Atendidos</th>
                        <th style={thStyle}>Monto Total Neto a Cobrar</th>
                      </tr>
                    </thead>
                    <tbody>
                      {personal
                        .filter(p => usuarioAutenticado.rol !== 'estilista' || p.nombre === usuarioAutenticado.nombre)
                        .filter(p => p.cargo === 'Estilista')
                        .map(p => {
                          const ventas = citas.filter(c => c.personal === p.nombre).reduce((acc, c) => acc + c.precio, 0);
                          const ganancia = ventas * p.comision;
                          const totalDescuentos = descuentos.filter(d => d.personal === p.nombre).reduce((sum, d) => sum + d.monto, 0);
                          const netoFinal = ganancia - totalDescuentos;
                          return (
                            <tr key={p.id} style={{ borderBottom: '1px solid #E2DDD5' }}>
                              <td style={tdStyle}><strong>{p.nombre}</strong></td>
                              <td style={tdStyle}>{citas.filter(c => c.personal === p.nombre).length} servicios</td>
                              <td style={tdStyle}><strong style={{ color: '#059669', fontSize: '18px' }}>Bs {netoFinal.toFixed(2)}</strong></td>
                            </tr>
                          );
                        })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* RECOMENDACIONES Y COMENTARIOS DEL DUEÑO */}
            {activoTab === 'recomendaciones' && (
              <div>
                <h2 style={{ borderLeft: '4px solid #E8C5C8', paddingLeft: '8px', marginBottom: '20px' }}>Recomendaciones y Comentarios Gerenciales</h2>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '24px' }}>
                  {usuarioAutenticado.rol === 'gerencia' && (
                    <div style={{ backgroundColor: '#FFFFFF', padding: '24px', borderRadius: '8px', border: '1px solid #E2DDD5' }}>
                      <h3 style={{ marginTop: 0 }}>Enviar Comentario a Estilista</h3>
                      <form onSubmit={guardarRecomendacion} style={{ display: 'grid', gap: '14px' }}>
                        <div>
                          <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Estilista Destinataria:</label>
                          <select value={recEstilista} onChange={(e) => setRecEstilista(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }}>
                            {personal.filter(p => p.cargo === 'Estilista').map(p => (
                              <option key={p.id} value={p.nombre}>{p.nombre}</option>
                            ))}
                          </select>
                        </div>
                        <div>
                          <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '4px' }}>Mensaje / Recomendación:</label>
                          <textarea rows="4" placeholder="Ej. Buen trabajo esta semana..." value={recMensaje} onChange={(e) => setRecMensaje(e.target.value)} style={{ width: '100%', padding: '8px', borderRadius: '4px', border: '1px solid #E2DDD5' }} required />
                        </div>
                        <button type="submit" style={btnPrimaryStyle}>Enviar Mensaje Privado</button>
                      </form>
                    </div>
                  )}

                  <div style={{ backgroundColor: '#FFFFFF', padding: '24px', borderRadius: '8px', border: '1px solid #E2DDD5' }}>
                    <h3 style={{ marginTop: 0 }}>
                      {usuarioAutenticado.rol === 'estilista' ? `Mis Comentarios (${usuarioAutenticado.nombre})` : 'Bandeja de Comentarios'}
                    </h3>
                    <div style={{ display: 'grid', gap: '12px' }}>
                      {recomendaciones
                        .filter(r => usuarioAutenticado.rol !== 'estilista' || r.estilista === usuarioAutenticado.nombre)
                        .map(r => (
                          <div key={r.id} style={{ padding: '14px', backgroundColor: '#F9F8F6', borderRadius: '6px', borderLeft: '4px solid #E8C5C8', border: '1px solid #E2DDD5' }}>
                            <div style={{ fontSize: '12px', fontWeight: '700', color: '#D97706', marginBottom: '4px' }}>Para: {r.estilista} • {r.fecha}</div>
                            <p style={{ margin: 0, fontSize: '14px', color: '#333' }}>{r.mensaje}</p>
                          </div>
                        ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* PESTAÑA DE SOLICITUDES / AUTORIZACIONES */}
            {activoTab === 'misAutorizaciones' && (
              <div>
                <h2 style={{ borderLeft: '4px solid #E8C5C8', paddingLeft: '8px', marginBottom: '20px' }}>Panel de Solicitudes y Autorizaciones</h2>
                <div style={{ backgroundColor: '#FFFFFF', padding: '24px', borderRadius: '8px', border: '1px solid #E2DDD5' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
                    <thead>
                      <tr style={{ backgroundColor: '#F5EBEE', borderBottom: '2px solid #E2DDD5' }}>
                        <th style={thStyle}>Solicitante</th>
                        <th style={thStyle}>Tipo</th>
                        <th style={thStyle}>Detalle</th>
                        <th style={thStyle}>Estado</th>
                        <th style={thStyle}>Acción</th>
                      </tr>
                    </thead>
                    <tbody>
                      {autorizaciones
                        .filter(a => (usuarioAutenticado.rol === 'gerencia' || usuarioAutenticado.rol === 'administracion') || a.solicitante === usuarioAutenticado.nombre)
                        .map(a => (
                          <tr key={a.id} style={{ borderBottom: '1px solid #E2DDD5' }}>
                            <td style={tdStyle}><strong>{a.solicitante}</strong></td>
                            <td style={tdStyle}>{a.tipo}</td>
                            <td style={tdStyle}>{a.detalle}</td>
                            <td style={tdStyle}>{a.estado}</td>
                            <td style={tdStyle}>
                              {(usuarioAutenticado.rol === 'gerencia' || usuarioAutenticado.rol === 'administracion') && a.estado === 'PENDIENTE' && (
                                <button onClick={() => aprobarAutorizacion(a.id)} style={{ backgroundColor: '#059669', color: '#FFF', border: 'none', padding: '4px 8px', borderRadius: '4px', cursor: 'pointer', fontSize: '11px', fontWeight: '700' }}>Aprobar</button>
                              )}
                            </td>
                          </tr>
                        ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* CONFIGURACIÓN MAESTRA */}
            {activoTab === 'config' && usuarioAutenticado.rol === 'gerencia' && (
              <div>
                <h2 style={{ borderLeft: '4px solid #E8C5C8', paddingLeft: '8px', marginBottom: '20px' }}>Gestión de Personal y Claves de Acceso (PINs)</h2>
                <div style={{ backgroundColor: '#FFFFFF', padding: '24px', borderRadius: '8px', border: '1px solid #E2DDD5' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
                    <thead>
                      <tr style={{ backgroundColor: '#F5EBEE', borderBottom: '2px solid #E2DDD5' }}>
                        <th style={thStyle}>Nombre</th>
                        <th style={thStyle}>Cargo</th>
                        <th style={thStyle}>PIN</th>
                        <th style={thStyle}>Comisión</th>
                      </tr>
                    </thead>
                    <tbody>
                      {personal.map(p => (
                        <tr key={p.id} style={{ borderBottom: '1px solid #E2DDD5' }}>
                          <td style={tdStyle}><strong>{p.nombre}</strong></td>
                          <td style={tdStyle}>{p.cargo}</td>
                          <td style={tdStyle}><span style={{ backgroundColor: '#E5E7EB', padding: '2px 6px', borderRadius: '4px', fontFamily: 'monospace', fontWeight: '700' }}>{p.pin}</span></td>
                          <td style={tdStyle}>{(p.comision * 100)}%</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const tabStyle = (activo) => ({
      backgroundColor: activo ? '#E8C5C8' : 'transparent',
      color: activo ? '#1A1A1A' : '#FFFFFF',
      border: 'none', padding: '12px 14px', cursor: 'pointer', fontWeight: '600', fontSize: '13px', whiteSpace: 'nowrap'
    });

    const thStyle = { padding: '10px 12px', fontWeight: '600', color: '#1A1A1A' };
    const tdStyle = { padding: '10px 12px', color: '#333' };
    const btnPrimaryStyle = { backgroundColor: '#1A1A1A', color: '#FFFFFF', border: 'none', padding: '8px 16px', borderRadius: '4px', fontWeight: '600', cursor: 'pointer' };

    function TarjetaKPI({ titulo, valor, color }) {
      return (
        <div style={{ backgroundColor: '#FFFFFF', padding: '20px', borderRadius: '8px', border: '1px solid #E2DDD5', borderLeft: `4px solid ${color}` }}>
          <span style={{ fontSize: '12px', color: '#666', fontWeight: '600', textTransform: 'uppercase' }}>{titulo}</span>
          <h3 style={{ fontSize: '22px', margin: '8px 0 0 0', color: '#1A1A1A' }}>{valor}</h3>
        </div>
      );
    }

    ReactDOM.render(<MerakiBeautySaaS />, document.getElementById('root'));
  </script>
</body>
</html>
